plot: "Fuck yeah - Pixel Art!"
text: >
    On May 20th Martha will talk about Pixel Art. 
    Her talk will give you insights into basics, the usual techniques and also how creative decisions affect the underlying technical details of good Pixel Art. This talk is aimed at everyone who wants to get to know it or if  you want to gain a better understanding of how it works as an art style. 
    
    
    As usual, there will be time for demos and socializing after the talk.  
    
    
    Looking forward to seeing you there!
