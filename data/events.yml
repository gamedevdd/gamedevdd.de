text: >
    On March 10th Fio will talk about the game dev's responsibility towards the audience in the sense that creators cause emtions in players and should be mindful of their effects. Fio will also present some best practices for handling these situations. 
    
    This meetup will be on a Tuesday and the talk will start around 18:30. After the talk, there will be time for demos and socializing.  
    
    Looking forward to seeing you there!
