plot: "Gamedev DD Jam #2"
text: >
    Welcome to the next iteration of the Dresden Gamedev Meetup Gamejam!
    
    As always, we are all busy bees, so the gamejam will be asynchronous: spend as much or as little time as you want while remembering to take care of yourself. This is an opportunity for us to hone our skills, try out new things, practice making games in a sustainable way or even to make a game for the very first time, not an excuse to burn ourselves out.
    
    We will be starting with an (optional) in-person kickoff at FHD Dresden, Güntzstraße 1 to form teams (if you haven't already) and reveal the theme on the 28.08 18:00.
    
    The end will also be at the FHD and coincide with our next meetup on the 23.09. Our jam will be unranked, but we plan of having (very) brief presentations on what each team/person was up to and what their experience was. 
    
    As always, there will be an opportunity to play games created during the jam or thing you are working on in general. 
