plot: "Box art for games"
text: >
    We'll be meeting up after the winter break on January 28 for our first meetup of the new year. Your organizing team is really looking forward to seeing you all again in the coming year! 
    

    To provide some input, I'll be giving a talk about box art in German, but feel free to request an english talk, so you can show your game in its best light at the next jam or even on a store page. Because whether it's games, movies, albums, or even this post right here, cover art is often the first and sometimes only clue people have to decide whether to click or buy. Whether you want to hire an artist or do it yourself, this talk will give you the tools you need to understand how games convey their themes, content, and genres to potential customers. 
    

    Of course, in addition to the lecture, there will still be the opportunity to bring your own games or test games from the community. Thanks to the FHD for the rooms. We are really looking forward to seeing you and wish you a happy New Year and relaxing holidays. 
